; Drone ESP32 - étape 1 : télécommande ESP-NOW et récepteur d'essai
; Téléverser la télécommande : pio run -e telecommande -t upload
; Téléverser le récepteur    : pio run -e recepteur -t upload
[platformio]
default_envs = telecommande, recepteur

[env:telecommande]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<telecommande/>

[env:recepteur]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_src_filter = +<recepteur/>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
